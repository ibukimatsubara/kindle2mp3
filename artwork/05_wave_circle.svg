<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b263b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0aaff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1400" fill="url(#bg5)"/>
  <!-- Concentric sound rings -->
  <g transform="translate(700,580)">
    <circle cx="0" cy="0" r="440" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.15"/>
    <circle cx="0" cy="0" r="370" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.25"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.4"/>
    <circle cx="0" cy="0" r="230" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.6"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.8"/>
    <!-- Center book icon -->
    <g transform="scale(1.8)">
      <path d="M-50,50 L-50,-40 Q-50,-55 -35,-55 L-5,-55 Q0,-55 0,-40 L0,50 Z" fill="#e0aaff"/>
      <path d="M50,50 L50,-40 Q50,-55 35,-55 L5,-55 Q0,-55 0,-40 L0,50 Z" fill="#c77dff"/>
      <line x1="0" y1="-55" x2="0" y2="50" stroke="#9d4edd" stroke-width="2"/>
    </g>
    <!-- Small sound dots on rings -->
    <circle cx="160" cy="0" r="10" fill="#e0aaff"/>
    <circle cx="-160" cy="0" r="10" fill="#e0aaff"/>
    <circle cx="0" cy="230" r="8" fill="#c77dff" opacity="0.7"/>
    <circle cx="0" cy="-230" r="8" fill="#c77dff" opacity="0.7"/>
    <circle cx="213" cy="213" r="7" fill="#e0aaff" opacity="0.5"/>
    <circle cx="-213" cy="-213" r="7" fill="#e0aaff" opacity="0.5"/>
    <circle cx="-262" cy="150" r="6" fill="#c77dff" opacity="0.3"/>
    <circle cx="262" cy="-150" r="6" fill="#c77dff" opacity="0.3"/>
  </g>
  <!-- Title -->
  <text x="700" y="1150" text-anchor="middle" font-family="Helvetica" font-size="100" font-weight="700" fill="white" letter-spacing="3">kindle2mp3</text>
  <text x="700" y="1230" text-anchor="middle" font-family="Helvetica" font-size="42" fill="#c77dff" letter-spacing="5">AUDIOBOOK PODCAST</text>
</svg>
