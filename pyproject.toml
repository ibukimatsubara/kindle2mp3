[project]
name = "kindle2mp3"
version = "0.1.0"
description = "CLI pipeline for screenshot capture, OCR, TTS, and audiobook assembly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.2.1",
  "paddleocr>=3.0.0",
  "paddlepaddle>=3.0.0",
  "pyobjc-framework-Quartz>=11.1",
]

[project.scripts]
kindle2mp3 = "kindle2mp3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindle2mp3"]
